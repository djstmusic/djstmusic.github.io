<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DJSTMUSIC | Santali DJ Songs</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#f4f6f9;
  color:#222;
}

header{
  background:#080808;
  color:#fff;
  text-align:center;
  padding:35px 15px;
  border-bottom:5px solid #00aaff;
}

.logo{
  width:180px;
  height:180px;
  object-fit:cover;
  border-radius:25px;
  margin-bottom:18px;
}

header h1{
  font-size:42px;
  margin-bottom:10px;
}

header p{
  color:#ccc;
  font-size:18px;
}

.buttons{
  display:flex;
  justify-content:center;
  gap:15px;
  flex-wrap:wrap;
  padding:30px 15px 20px;
}

.btn{
  text-decoration:none;
  color:white;
  padding:16px 30px;
  border-radius:35px;
  font-size:18px;
  font-weight:bold;
}

.youtube{
  background:#e60000;
}

.whatsapp{
  background:#18b94b;
}

.search{
  max-width:850px;
  margin:10px auto 30px;
  padding:0 15px;
  display:flex;
  gap:10px;
}

.search input{
  flex:1;
  padding:18px 22px;
  border:2px solid #ddd;
  border-radius:35px;
  font-size:17px;
  outline:none;
}

.search button{
  width:65px;
  border:0;
  border-radius:50%;
  background:#129bd5;
  color:#fff;
  font-size:25px;
}

.container{
  max-width:950px;
  margin:auto;
  padding:0 15px 100px;
}

.section-title{
  background:#159bd3;
  color:#fff;
  padding:20px;
  border-radius:15px;
  font-size:28px;
  margin-bottom:20px;
}

.song{
  background:#fff;
  border-radius:15px;
  padding:18px;
  margin-bottom:15px;
  box-shadow:0 3px 12px #0001;
  display:flex;
  align-items:center;
  gap:18px;
}

.song-img{
  width:90px;
  height:90px;
  object-fit:cover;
  border-radius:12px;
  flex-shrink:0;
}

.song-info{
  flex:1;
  min-width:0;
}

.song-title{
  color:#168ab8;
  font-size:20px;
  font-weight:bold;
  margin-bottom:10px;
  word-break:break-word;
}

audio{
  width:100%;
  margin-top:5px;
}

.download{
  display:inline-block;
  margin-top:10px;
  background:#1745f5;
  color:#fff;
  text-decoration:none;
  padding:10px 18px;
  border-radius:8px;
  font-weight:bold;
}

.loading,
.empty,
.error{
  background:#fff;
  padding:35px 20px;
  text-align:center;
  border-radius:15px;
  color:#666;
  margin-bottom:20px;
}

.error{
  color:#c00;
}

footer{
  background:#080808;
  color:#aaa;
  text-align:center;
  padding:25px;
}

@media(max-width:600px){

  header{
    padding:25px 10px;
  }

  .logo{
    width:150px;
    height:150px;
  }

  header h1{
    font-size:32px;
  }

  header p{
    font-size:15px;
  }

  .song{
    padding:12px;
    gap:12px;
  }

  .song-img{
    width:75px;
    height:75px;
  }

  .song-title{
    font-size:17px;
  }

  .section-title{
    font-size:23px;
  }
}
</style>
</head>

<body>

<header>

<img src="dj-logo.png" class="logo" alt="DJSTMUSIC">

<h1>DJSTMUSIC</h1>

<p>Latest Santali Songs, Music & Entertainment</p>

</header>


<div class="buttons">

<a class="btn youtube"
href="https://www.youtube.com/"
target="_blank">
▶ Subscribe on YouTube
</a>

<a class="btn whatsapp"
href="https://wa.me/"
target="_blank">
💬 WhatsApp
</a>

</div>


<div class="search">

<input
type="text"
id="search"
placeholder="Search Santali Songs..."
oninput="searchSongs()">

<button onclick="searchSongs()">🔍</button>

</div>


<div class="container">

<div class="section-title">
🎵 Latest Santali Songs
</div>

<div id="songs">

<div class="loading">
🎵 Songs loading...
</div>

</div>

</div>


<footer>
© 2026 DJSTMUSIC | All Rights Reserved
</footer>


<script>

/* =================================
   YOUR GITHUB REPOSITORY
   ================================= */

const OWNER = "djstmusic";
const REPO = "djstmusic.github.io";
const BRANCH = "main";


let allSongs = [];


/* =================================
   GET FILES FROM GITHUB
   ================================= */

async function getFiles(path = ""){

  const url =
  `https://api.github.com/repos/${OWNER}/${REPO}/contents/${path}?ref=${BRANCH}`;

  const response = await fetch(url);

  if(!response.ok){
    throw new Error("GitHub API error");
  }

  return await response.json();
}


/* =================================
   FIND ALL MP3 FILES
   ROOT + SONGS FOLDER
   ================================= */

async function findMP3(){

  let result = [];

  /* ROOT FILES */

  try{

    const rootFiles = await getFiles("");

    for(const file of rootFiles){

      if(
        file.type === "file" &&
        file.name.toLowerCase().endsWith(".mp3")
      ){

        result.push(file);

      }

    }

  }catch(e){

    console.log("Root scan error",e);

  }


  /* SONGS FOLDER */

  try{

    const songFiles = await getFiles("songs");

    for(const file of songFiles){

      if(
        file.type === "file" &&
        file.name.toLowerCase().endsWith(".mp3")
      ){

        result.push(file);

      }

    }

  }catch(e){

    console.log("songs folder not found");

  }


  return result;

}


/* =================================
   LOAD SONGS
   ================================= */

async function loadSongs(){

  const box =
  document.getElementById("songs");

  box.innerHTML = `
    <div class="loading">
      🎵 Songs loading...
    </div>
  `;


  try{

    allSongs = await findMP3();


    if(allSongs.length === 0){

      box.innerHTML = `
        <div class="empty">
          🎵 Abhi koi MP3 song upload nahi hai.
          <br><br>
          GitHub repository me MP3 upload karo.
        </div>
      `;

      return;

    }


    /* NEWEST FIRST */

    allSongs.reverse();

    displaySongs(allSongs);


  }catch(error){

    console.log(error);

    box.innerHTML = `
      <div class="error">
        ❌ Songs load nahi ho pa rahe.
        <br><br>
        Thodi der baad page refresh karo.
      </div>
    `;

  }

}


/* =================================
   SHOW SONGS
   ================================= */

function displaySongs(songs){

  const box =
  document.getElementById("songs");


  if(songs.length === 0){

    box.innerHTML = `
      <div class="empty">
        🔎 Song nahi mila.
      </div>
    `;

    return;

  }


  box.innerHTML = songs.map(song => {

    const fileURL =
    `https://raw.githubusercontent.com/${OWNER}/${REPO}/${BRANCH}/${song.path
      .split("/")
      .map(x => encodeURIComponent(x))
      .join("/")}`;


    const title =
    song.name
    .replace(/\.mp3$/i,"")
    .replace(/[_-]/g," ");


    return `

    <div class="song">

      <img
      src="dj-logo.png"
      class="song-img"
      alt="${title}">

      <div class="song-info">

        <div class="song-title">
          🎵 ${title}
        </div>

        <audio
        controls
        preload="none"
        src="${fileURL}">
        </audio>

        <br>

        <a
        class="download"
        href="${fileURL}"
        download="${song.name}">
        ⬇ Download
        </a>

      </div>

    </div>

    `;

  }).join("");

}


/* =================================
   SEARCH
   ================================= */

function searchSongs(){

  const text =
  document
  .getElementById("search")
  .value
  .toLowerCase()
  .trim();


  if(!text){

    displaySongs(allSongs);

    return;

  }


  const result =
  allSongs.filter(song =>
    song.name
    .toLowerCase()
    .includes(text)
  );


  displaySongs(result);

}


/* =================================
   START
   ================================= */

loadSongs();

</script>

</body>
</html>
