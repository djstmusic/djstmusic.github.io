<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>DJSTMUSIC | Santali DJ Songs</title>

  <meta name="description"
        content="DJSTMUSIC - Latest Santali DJ Songs, DJ Remixes, HD Audio and Entertainment.">

  <meta name="theme-color" content="#111111">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #222;
    }

    header {
      background: linear-gradient(135deg, #080808, #1c1c1c);
      color: white;
      text-align: center;
      padding: 35px 15px 30px;
      border-bottom: 5px solid #00a8ff;
    }

    .logo {
      width: 180px;
      height: 180px;
      object-fit: cover;
      border-radius: 25px;
      display: block;
      margin: auto;
      box-shadow: 0 10px 35px rgba(0,0,0,.5);
    }

    .site-title {
      font-size: 38px;
      font-weight: 800;
      margin-top: 20px;
      letter-spacing: 1px;
    }

    .tagline {
      color: #cfcfcf;
      font-size: 17px;
      margin-top: 8px;
    }

    .youtube-btn {
      display: inline-block;
      margin-top: 22px;
      padding: 14px 28px;
      background: #ff0000;
      color: white;
      text-decoration: none;
      border-radius: 30px;
      font-weight: bold;
      font-size: 17px;
      box-shadow: 0 5px 15px rgba(255,0,0,.3);
    }

    .container {
      max-width: 1000px;
      margin: 25px auto;
      padding: 0 15px;
    }

    .search-box {
      display: flex;
      gap: 10px;
      margin-bottom: 25px;
    }

    .search-box input {
      flex: 1;
      padding: 16px 20px;
      border: 2px solid #ddd;
      border-radius: 30px;
      font-size: 16px;
      outline: none;
    }

    .search-box input:focus {
      border-color: #00a8ff;
    }

    .search-box button {
      border: none;
      width: 55px;
      border-radius: 50%;
      background: #00a8ff;
      color: white;
      font-size: 22px;
      cursor: pointer;
    }

    .section-title {
      background: linear-gradient(135deg, #079bd3, #0077b6);
      color: white;
      padding: 18px 20px;
      border-radius: 15px;
      font-size: 25px;
      margin-bottom: 18px;
    }

    .song-list {
      display: grid;
      gap: 15px;
    }

    .song {
      background: white;
      border-radius: 16px;
      padding: 18px;
      box-shadow: 0 4px 15px rgba(0,0,0,.08);
    }

    .song-title {
      font-size: 19px;
      font-weight: bold;
      color: #167ba5;
      margin-bottom: 12px;
      word-break: break-word;
    }

    .song-info {
      color: #777;
      font-size: 14px;
      margin-bottom: 12px;
    }

    audio {
      width: 100%;
      margin-bottom: 12px;
    }

    .download {
      display: inline-block;
      background: #16a34a;
      color: white;
      text-decoration: none;
      padding: 10px 18px;
      border-radius: 25px;
      font-weight: bold;
    }

    .empty {
      text-align: center;
      background: white;
      padding: 35px 20px;
      border-radius: 15px;
      color: #777;
      font-size: 17px;
    }

    .loading {
      text-align: center;
      padding: 30px;
      color: #666;
    }

    footer {
      margin-top: 45px;
      background: #111;
      color: #aaa;
      text-align: center;
      padding: 25px 15px;
      font-size: 14px;
    }

    @media (max-width: 600px) {
      .logo {
        width: 145px;
        height: 145px;
      }

      .site-title {
        font-size: 30px;
      }

      .tagline {
        font-size: 15px;
      }

      .section-title {
        font-size: 21px;
      }

      .song-title {
        font-size: 17px;
      }
    }
  </style>
</head>

<body>

<header>

  <!-- LOGO -->
  <!-- Logo change karne ke baad ?v=3, ?v=4 etc. kar sakte ho -->
  <img
    class="logo"
    src="dj-logo.png?v=3"
    alt="DJSTMUSIC Logo"
    onerror="this.src='dj-logo.png?v=4'"
  >

  <h1 class="site-title">DJSTMUSIC</h1>

  <p class="tagline">
    Latest Santali Songs, DJ Remixes & Entertainment
  </p>

  <a
    class="youtube-btn"
    href="https://www.youtube.com/@djrabirajhembramdebidanga"
    target="_blank"
    rel="noopener">
    ▶ Subscribe on YouTube
  </a>

</header>


<main class="container">

  <div class="search-box">
    <input
      type="text"
      id="search"
      placeholder="Search Santali Songs..."
      oninput="searchSongs()"
    >

    <button onclick="searchSongs()">🔍</button>
  </div>


  <h2 class="section-title">
    🎵 Latest Santali Songs
  </h2>


  <div id="songs" class="song-list">
    <div class="loading">
      ⏳ Songs loading...
    </div>
  </div>

</main>


<footer>
  © 2026 DJSTMUSIC
  <br>
  Santali DJ Songs • Music • Entertainment
</footer>


<script>

  /*
    ==================================================
    DJSTMUSIC AUTOMATIC MP3 SYSTEM
    ==================================================

    GitHub repository:
    djstmusic/djstmusic.github.io

    Aap sirf GitHub repository ke main folder me
    .mp3 upload karo.

    Website automatically MP3 detect karegi.
  */

  const GITHUB_API =
    "https://api.github.com/repos/djstmusic/djstmusic.github.io/contents/";

  const RAW_URL =
    "https://raw.githubusercontent.com/djstmusic/djstmusic.github.io/main/";

  let allSongs = [];


  // Filename ko professional title me convert karega
  function cleanTitle(filename) {

    return filename
      .replace(/\.[^/.]+$/, "")
      .replace(/[_-]+/g, " ")
      .replace(/\s+/g, " ")
      .trim();

  }


  // MP3 songs load
  async function loadSongs() {

    const container = document.getElementById("songs");

    try {

      const response = await fetch(GITHUB_API);

      if (!response.ok) {
        throw new Error("GitHub API error");
      }

      const files = await response.json();

      allSongs = files
        .filter(file =>
          file.type === "file" &&
          file.name.toLowerCase().endsWith(".mp3")
        )
        .reverse();

      displaySongs(allSongs);

    } catch (error) {

      console.error(error);

      container.innerHTML = `
        <div class="empty">
          ⚠️ Songs load nahi ho paaye.<br><br>
          Thodi der baad page refresh karein.
        </div>
      `;

    }

  }


  // Songs display
  function displaySongs(songs) {

    const container = document.getElementById("songs");

    if (songs.length === 0) {

      container.innerHTML = `
        <div class="empty">
          🎵 Abhi koi song upload nahi hai.
          <br><br>
          GitHub repository me MP3 upload karein.
        </div>
      `;

      return;
    }


    container.innerHTML = "";


    songs.forEach((song, index) => {

      const title = cleanTitle(song.name);

      const songURL =
        RAW_URL + encodeURIComponent(song.name);


      const sizeMB =
        song.size
          ? (song.size / (1024 * 1024)).toFixed(2)
          : "--";


      const card = document.createElement("div");

      card.className = "song";

      card.innerHTML = `

        <div class="song-title">
          🎵 ${escapeHTML(title)}
        </div>

        <div class="song-info">
          ${sizeMB} MB • MP3 Audio
        </div>

        <audio controls preload="none">
          <source
            src="${songURL}"
            type="audio/mpeg">
          Your browser does not support audio.
        </audio>

        <br>

        <a
          class="download"
          href="${songURL}"
          download>
          ⬇ Download
        </a>

      `;

      container.appendChild(card);

    });

  }


  // Search
  function searchSongs() {

    const query =
      document
        .getElementById("search")
        .value
        .toLowerCase()
        .trim();


    const filtered =
      allSongs.filter(song =>
        cleanTitle(song.name)
          .toLowerCase()
          .includes(query)
      );


    displaySongs(filtered);

  }


  // Security helper
  function escapeHTML(text) {

    return text
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  // Page load
  loadSongs();

</script>

</body>
</html>
