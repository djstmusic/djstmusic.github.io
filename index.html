<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DJST MUSIC | Latest Santali Songs</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f4f6fa;
    color:#222;
}

.header{
    background:#080808;
    text-align:center;
    padding:30px 15px;
    border-bottom:4px solid #00aaff;
}

.logo{
    width:150px;
    height:150px;
    object-fit:cover;
    border-radius:25px;
}

.header h1{
    color:white;
    margin:15px 0 5px;
    font-size:32px;
}

.header p{
    color:#aaa;
    font-size:17px;
    margin:0;
}

.buttons{
    text-align:center;
    padding:25px 10px;
    background:white;
}

.btn{
    display:inline-block;
    text-decoration:none;
    color:white;
    padding:15px 28px;
    margin:7px;
    border-radius:35px;
    font-size:18px;
    font-weight:bold;
}

.youtube{
    background:#ff0000;
}

.whatsapp{
    background:#16c65b;
}

.search-box{
    display:flex;
    max-width:650px;
    margin:20px auto;
    padding:0 15px;
}

.search-box input{
    flex:1;
    padding:17px;
    border:2px solid #ddd;
    border-radius:30px 0 0 30px;
    outline:none;
    font-size:16px;
}

.search-box button{
    border:0;
    width:65px;
    border-radius:0 30px 30px 0;
    background:#159bd3;
    color:white;
    font-size:22px;
}

.section-title{
    max-width:900px;
    margin:20px auto 0;
    background:#159bd3;
    color:white;
    padding:18px 20px;
    font-size:25px;
    font-weight:bold;
    border-radius:15px 15px 0 0;
}

.songs{
    max-width:900px;
    margin:auto;
    background:white;
}

.song{
    padding:18px;
    border-bottom:1px solid #eee;
    display:flex;
    align-items:center;
    gap:15px;
}

.song-img{
    width:90px;
    height:90px;
    object-fit:cover;
    border-radius:12px;
    flex-shrink:0;
}

.song-info{
    flex:1;
}

.song-title{
    color:#1689b9;
    font-size:20px;
    font-weight:bold;
    margin-bottom:8px;
}

.song-file{
    color:#777;
    font-size:14px;
    margin-bottom:10px;
    word-break:break-all;
}

.download{
    display:inline-block;
    background:#1557ff;
    color:white;
    text-decoration:none;
    padding:9px 16px;
    border-radius:20px;
    font-weight:bold;
}

.player{
    width:100%;
    margin-top:8px;
}

.loading,
.empty,
.error{
    text-align:center;
    padding:35px 15px;
    color:#777;
    font-size:18px;
}

.footer{
    margin-top:30px;
    background:#111;
    color:#aaa;
    text-align:center;
    padding:25px 10px;
}

@media(max-width:600px){
    .header h1{
        font-size:27px;
    }

    .song{
        padding:15px 10px;
    }

    .song-img{
        width:75px;
        height:75px;
    }

    .song-title{
        font-size:17px;
    }

    .section-title{
        font-size:21px;
    }
}
</style>
</head>

<body>

<!-- HEADER -->
<header class="header">

    <img src="dj-logo.png" class="logo" alt="DJST MUSIC">

    <h1>DJST MUSIC</h1>

    <p>Latest Santali Songs, Music & Entertainment</p>

</header>


<!-- SOCIAL BUTTONS -->
<div class="buttons">

    <!-- Apna YouTube channel link yahan lagaye -->
    <a class="btn youtube"
       href="https://www.youtube.com/"
       target="_blank">
       ▶ Subscribe on YouTube
    </a>

    <!-- Apna WhatsApp number yahan lagaye -->
    <a class="btn whatsapp"
       href="https://wa.me/918918642452"
       target="_blank">
       💬 WhatsApp
    </a>

</div>


<!-- SEARCH -->
<div class="search-box">

    <input
        type="text"
        id="search"
        placeholder="Search Santali Songs..."
        onkeyup="searchSongs()">

    <button>🔍</button>

</div>


<!-- SONG SECTION -->
<div class="section-title">
    🎵 Latest Santali Songs
</div>

<div class="songs" id="songs">

    <div class="loading">
        🎵 Songs loading...
    </div>

</div>


<!-- FOOTER -->
<footer class="footer">

    © 2026 DJST MUSIC<br>
    Latest Santali Songs & Music

</footer>


<script>

/* =====================================================
   GITHUB SETTINGS
   ===================================================== */

const GITHUB_USER = "djstmusic";
const GITHUB_REPO = "djstmusic.github.io";
const GITHUB_BRANCH = "main";


/* =====================================================
   MP3 SONG AUTOMATICALLY LOAD
   ===================================================== */

let allSongs = [];


async function loadSongs(){

    const songsBox = document.getElementById("songs");

    try{

        const api =
        `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/?ref=${GITHUB_BRANCH}`;

        const response = await fetch(api);

        if(!response.ok){
            throw new Error("GitHub API error");
        }

        const files = await response.json();

        allSongs = files.filter(file =>
            file.type === "file" &&
            file.name.toLowerCase().endsWith(".mp3")
        );

        if(allSongs.length === 0){

            songsBox.innerHTML = `
                <div class="empty">
                    🎵 Abhi koi song upload nahi hai.
                </div>
            `;

            return;
        }

        displaySongs(allSongs);

    }catch(error){

        console.error(error);

        songsBox.innerHTML = `
            <div class="error">
                ❌ Songs load nahi ho pa rahe.<br>
                Thodi der baad page refresh karein.
            </div>
        `;

    }

}


/* =====================================================
   DISPLAY SONGS
   ===================================================== */

function displaySongs(songs){

    const songsBox = document.getElementById("songs");

    songsBox.innerHTML = "";

    songs.forEach(song => {

        const title = song.name
            .replace(".mp3","")
            .replace(/_/g," ")
            .replace(/-/g," ");

        const rawURL =
        `https://raw.githubusercontent.com/${GITHUB_USER}/${GITHUB_REPO}/${GITHUB_BRANCH}/${encodeURIComponent(song.name)}`;

        const div = document.createElement("div");

        div.className = "song";

        div.innerHTML = `

            <img
                src="dj-logo.png"
                class="song-img"
                alt="${title}">

            <div class="song-info">

                <div class="song-title">
                    ${title}
                </div>

                <div class="song-file">
                    ${song.name}
                </div>

                <audio
                    class="player"
                    controls
                    preload="none">
                    <source src="${rawURL}" type="audio/mpeg">
                </audio>

                <br>

                <a
                    class="download"
                    href="${rawURL}"
                    download="${song.name}">
                    ⬇ Download MP3
                </a>

            </div>
        `;

        songsBox.appendChild(div);

    });

}


/* =====================================================
   SEARCH SONG
   ===================================================== */

function searchSongs(){

    const search =
    document.getElementById("search")
    .value
    .toLowerCase()
    .trim();

    if(!search){

        displaySongs(allSongs);

        return;
    }

    const result = allSongs.filter(song =>
        song.name.toLowerCase().includes(search)
    );

    if(result.length === 0){

        document.getElementById("songs").innerHTML = `
            <div class="empty">
                🔎 Song nahi mila.
            </div>
        `;

        return;
    }

    displaySongs(result);

}


/* =====================================================
   START
   ===================================================== */

loadSongs();

</script>

</body>
</html>
